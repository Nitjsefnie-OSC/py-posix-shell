name: OSC Manual Validation

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Git ref or SHA to validate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  validate:
    name: Python 3.10
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate target input
        shell: bash
        env:
          TARGET_REF_INPUT: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_REF_INPUT//[[:space:]]/}" ]]; then
            echo "target_ref must contain non-whitespace characters" >&2
            exit 1
          fi

      - name: Check out trusted workflow state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Check out requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_ref }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve candidate provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git -C candidate rev-parse --verify HEAD)"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate HEAD is not a 40-character lowercase SHA" >&2
            exit 1
          fi
          echo "OSC_TARGET_SHA=$candidate_sha"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Create wrapper-owned pytest config
        shell: bash
        run: |
          set -euo pipefail
          pytest_config="$RUNNER_TEMP/osc-empty-pytest.ini"
          helper="$RUNNER_TEMP/osc-manifest.py"
          : > "$pytest_config"
          cat > "$helper" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          import pytest
          MANIFEST = None
          def canonical(nodes): return (json.dumps(nodes, ensure_ascii=True, separators=(",", ":")) + "\n").encode()
          def pytest_collection_finish(session): pathlib.Path(MANIFEST).write_bytes(canonical([item.nodeid for item in session.items]))
          def invoke_pytest(root, config, source, args, collect=False):
              sys.path.insert(1, source); os.chdir(root)
              os.environ.update(PYTEST_ADDOPTS="", PYTEST_DISABLE_PLUGIN_AUTOLOAD="1"); plugins = [sys.modules[__name__]] if collect else []
              return int(pytest.main(["-p", "no:cacheprovider", "-c", config, "--rootdir=.", *args], plugins=plugins))
          def child_env(): return dict(os.environ, PYTHONPATH="")
          def collect():
              root, config, source, manifest, log = sys.argv[2:]; pathlib.Path(manifest).unlink(missing_ok=True)
              command = [sys.executable, __file__, "pytest-collect", root, config, source, manifest]
              with open(log, "wb") as stream:
                  status = subprocess.run(command, cwd=root, env=child_env(), stdout=stream, stderr=subprocess.STDOUT).returncode
              if status: sys.stdout.buffer.write(pathlib.Path(log).read_bytes())
              return status
          def replay():
              root, config, source, label, manifest = sys.argv[2:]
              raw = pathlib.Path(manifest).read_bytes()
              try: nodes = json.loads(raw)
              except (json.JSONDecodeError, UnicodeDecodeError): raise SystemExit("invalid manifest JSON")
              invalid = not isinstance(nodes, list) or not nodes or any(not isinstance(node, str) or not node or "\0" in node for node in nodes)
              if invalid or len(nodes) != len(set(nodes)) or raw != canonical(nodes): raise SystemExit("manifest is not canonical nonempty unique node JSON")
              print(f"OSC_CENSUS={label} count={len(nodes)} sha256={hashlib.sha256(raw).hexdigest()}", flush=True)
              command = [sys.executable, __file__, "pytest-replay", root, config, source, *nodes]; return subprocess.run(command, cwd=root, env=child_env()).returncode
          mode = sys.argv[1]
          if mode == "pytest-collect":
              MANIFEST = sys.argv[5]
              status = invoke_pytest(*sys.argv[2:5], ["--collect-only", "-q", "."], collect=True)
          elif mode == "pytest-replay": status = invoke_pytest(*sys.argv[2:5], sys.argv[5:])
          elif mode == "collect": status = collect()
          elif mode == "replay": status = replay()
          else: raise SystemExit("unknown manifest helper mode")
          raise SystemExit(status)
          PY
          printf 'PYTEST_CONFIG=%s\nOSC_MANIFEST_HELPER=%s\n' "$pytest_config" "$helper" >> "$GITHUB_ENV"

      - name: Create trusted test environment
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/osc-test-venv"
          PYTHONPATH= python -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install --disable-pip-version-check --no-input "tomli==2.2.1" "pytest>=8"
          "$test_venv/bin/python" -c 'import tomli; assert tomli.__version__ == "2.2.1"; print(f"OSC_TEST_TOMLI={tomli.__version__}")'
          PYTHONPATH= "$test_venv/bin/python" - "$GITHUB_WORKSPACE/candidate/pyproject.toml" <<'PY'
          import sys
          import tomli as tomllib

          with open(sys.argv[1], "rb") as stream:
              project = tomllib.load(stream).get("project", {})
          dependencies = project.get("dependencies", [])
          dev = project.get("optional-dependencies", {}).get("dev")
          if dependencies != []:
              raise SystemExit("source-only test executor requires no candidate runtime dependencies")
          if dev != ["pytest>=8"]:
              raise SystemExit("candidate dev extra must be exactly the trusted pytest>=8 input")
          print("OSC_TEST_METADATA=source-only dependencies=0 dev=pytest>=8")
          PY
          test -x "$test_venv/bin/pytest"
          "$test_venv/bin/python" -c 'import pathlib, pytest, sys; root = pathlib.Path(sys.prefix).resolve(); module = pathlib.Path(pytest.__file__).resolve(); assert module.is_relative_to(root); print(f"OSC_TEST_PYTEST={module}")'
          echo "TEST_VENV=$test_venv" >> "$GITHUB_ENV"

      - name: Verify integrity before tests
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.provenance.outputs.candidate_sha }}
          EXPECTED_TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C candidate rev-parse --verify HEAD)" == "$EXPECTED_CANDIDATE_SHA" ]]
          [[ -z "$(git -C candidate status --porcelain --untracked-files=all --ignored=matching)" ]]
          [[ "$(git -C trusted rev-parse --verify HEAD)" == "$EXPECTED_TRUSTED_SHA" ]]
          [[ -z "$(git -C trusted status --porcelain --untracked-files=all --ignored=matching)" ]]

      - name: Run trusted baseline against candidate source
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/candidate/src
        run: |
          set -euo pipefail
          test_root="$GITHUB_WORKSPACE/trusted/tests"
          manifest="$RUNNER_TEMP/trusted-baseline.nodes.json"; collect_log="$RUNNER_TEMP/trusted-baseline.collect.log"
          run_helper() { [[ "$(sha256sum "$OSC_MANIFEST_HELPER" | cut -d' ' -f1)" == "b8e2e5e323829a4b3e84663e96259247bc7b211bc32f53e8a164405ddd9b337a" ]] && PYTHONPATH= "$TEST_VENV/bin/python" "$OSC_MANIFEST_HELPER" "$@"; }
          run_helper collect "$test_root" "$PYTEST_CONFIG" "$PYTHONPATH" "$manifest" "$collect_log"
          run_helper replay "$test_root" "$PYTEST_CONFIG" "$PYTHONPATH" trusted-baseline "$manifest"

      - name: Run candidate tests as additional surface
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/candidate/src
        run: |
          set -euo pipefail
          test_root="$GITHUB_WORKSPACE/candidate/tests"
          manifest="$RUNNER_TEMP/candidate.nodes.json"; collect_log="$RUNNER_TEMP/candidate.collect.log"
          run_helper() { [[ "$(sha256sum "$OSC_MANIFEST_HELPER" | cut -d' ' -f1)" == "b8e2e5e323829a4b3e84663e96259247bc7b211bc32f53e8a164405ddd9b337a" ]] && PYTHONPATH= "$TEST_VENV/bin/python" "$OSC_MANIFEST_HELPER" "$@"; }
          run_helper collect "$test_root" "$PYTEST_CONFIG" "$PYTHONPATH" "$manifest" "$collect_log"
          run_helper replay "$test_root" "$PYTEST_CONFIG" "$PYTHONPATH" candidate "$manifest"

      - name: Validate candidate packaging in sacrificial venv
        shell: bash
        run: |
          set -euo pipefail
          install_source="$RUNNER_TEMP/osc-candidate-install-src"
          package_venv="$RUNNER_TEMP/osc-package-venv"
          mkdir "$install_source"
          git -C candidate archive --format=tar HEAD | tar -x -C "$install_source"
          PYTHONPATH= python -m venv "$package_venv"
          "$package_venv/bin/python" -m pip install --disable-pip-version-check --no-input --editable "$install_source[dev]"
          echo "OSC_PACKAGING_SOURCE=$(git -C candidate rev-parse --verify HEAD)"

      - name: Verify integrity after candidate packaging
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.provenance.outputs.candidate_sha }}
          EXPECTED_TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C candidate rev-parse --verify HEAD)" == "$EXPECTED_CANDIDATE_SHA" ]]
          [[ -z "$(git -C candidate status --porcelain --untracked-files=all --ignored=matching)" ]]
          [[ "$(git -C trusted rev-parse --verify HEAD)" == "$EXPECTED_TRUSTED_SHA" ]]
          [[ -z "$(git -C trusted status --porcelain --untracked-files=all --ignored=matching)" ]]

      - name: Final integrity evidence
        if: ${{ always() }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.provenance.outputs.candidate_sha }}
          EXPECTED_TRUSTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -u
          failures=0
          check_checkout() {
            local repo="$1"
            local expected="$2"
            local status
            if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git -C "$repo" rev-parse --verify HEAD 2>/dev/null)" != "$expected" ]]; then
              echo "$repo HEAD no longer matches provenance" >&2
              failures=1
            fi
            if ! status="$(git -C "$repo" status --porcelain --untracked-files=all --ignored=matching 2>/dev/null)"; then
              echo "cannot inspect $repo checkout" >&2
              failures=1
            elif [[ -n "$status" ]]; then
              echo "$repo checkout is not clean" >&2
              printf '%s\n' "$status" >&2
              failures=1
            fi
          }
          check_checkout candidate "$EXPECTED_CANDIDATE_SHA"
          check_checkout trusted "$EXPECTED_TRUSTED_SHA"
          exit "$failures"
