name: OSC Manual Validation

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Git ref or SHA to validate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  validate:
    name: Python 3.10
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate target input
        shell: bash
        env:
          TARGET_REF_INPUT: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_REF_INPUT//[[:space:]]/}" ]]; then
            echo "target_ref must contain non-whitespace characters" >&2
            exit 1
          fi

      - name: Check out requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_ref }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve candidate provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git -C candidate rev-parse --verify HEAD)"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate HEAD is not a 40-character lowercase SHA" >&2
            exit 1
          fi
          echo "OSC_TARGET_SHA=$candidate_sha"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Create trusted test environment
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/osc-test-venv"
          pytest_config="$RUNNER_TEMP/osc-empty-pytest.ini"
          : > "$pytest_config"
          PYTHONPATH= python -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install --disable-pip-version-check --no-input "tomli==2.2.1" "pytest>=8"
          "$test_venv/bin/python" -c 'import tomli; assert tomli.__version__ == "2.2.1"; print(f"OSC_TEST_TOMLI={tomli.__version__}")'
          PYTHONPATH= "$test_venv/bin/python" - "$GITHUB_WORKSPACE/candidate/pyproject.toml" <<'PY'
          import sys
          import tomli as tomllib
          with open(sys.argv[1], "rb") as stream:
              project = tomllib.load(stream).get("project", {})
          dependencies = project.get("dependencies", [])
          dev = project.get("optional-dependencies", {}).get("dev")
          if dependencies != []:
              raise SystemExit("source-only test executor requires no candidate runtime dependencies")
          if dev != ["pytest>=8"]:
              raise SystemExit("candidate dev extra must be exactly the trusted pytest>=8 input")
          print("OSC_TEST_METADATA=source-only dependencies=0 dev=pytest>=8")
          PY
          test -x "$test_venv/bin/pytest"
          "$test_venv/bin/python" -c 'import pathlib, pytest, sys; root = pathlib.Path(sys.prefix).resolve(); module = pathlib.Path(pytest.__file__).resolve(); assert module.is_relative_to(root); print(f"OSC_TEST_PYTEST={module}")'
          printf 'TEST_VENV=%s\nPYTEST_CONFIG=%s\n' "$test_venv" "$pytest_config" >> "$GITHUB_ENV"

      - name: Verify integrity before tests
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.provenance.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C candidate rev-parse --verify HEAD)" == "$EXPECTED_CANDIDATE_SHA" ]]
          [[ -z "$(git -C candidate status --porcelain --untracked-files=all --ignored=matching)" ]]

      - name: Run complete candidate test suite
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/candidate/src
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/candidate"
          PYTEST_ADDOPTS= PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH="$PYTHONPATH" \
            "$TEST_VENV/bin/python" -m pytest -q -p no:cacheprovider -c "$PYTEST_CONFIG" \
            --rootdir=. tests

      - name: Validate candidate packaging in sacrificial venv
        shell: bash
        run: |
          set -euo pipefail
          install_source="$RUNNER_TEMP/osc-candidate-install-src"
          package_venv="$RUNNER_TEMP/osc-package-venv"
          mkdir "$install_source"
          git -C candidate archive --format=tar HEAD | tar -x -C "$install_source"
          PYTHONPATH= python -m venv "$package_venv"
          "$package_venv/bin/python" -m pip install --disable-pip-version-check --no-input --editable "$install_source[dev]"
          echo "OSC_PACKAGING_SOURCE=$(git -C candidate rev-parse --verify HEAD)"

      - name: Verify integrity after candidate packaging
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.provenance.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C candidate rev-parse --verify HEAD)" == "$EXPECTED_CANDIDATE_SHA" ]]
          [[ -z "$(git -C candidate status --porcelain --untracked-files=all --ignored=matching)" ]]

      - name: Final integrity evidence
        if: ${{ always() }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.provenance.outputs.candidate_sha }}
        shell: bash
        run: |
          set -u
          failures=0
          status=""
          if [[ ! "$EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [[ "$(git -C candidate rev-parse --verify HEAD 2>/dev/null)" != "$EXPECTED_CANDIDATE_SHA" ]]; then
            echo "candidate HEAD no longer matches provenance" >&2
            failures=1
          fi
          if ! status="$(git -C candidate status --porcelain --untracked-files=all --ignored=matching 2>/dev/null)"; then
            echo "cannot inspect candidate checkout" >&2
            failures=1
          elif [[ -n "$status" ]]; then
            echo "candidate checkout is not clean" >&2
            printf '%s\n' "$status" >&2
            failures=1
          fi
          exit "$failures"
